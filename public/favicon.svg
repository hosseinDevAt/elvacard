<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <defs>
        <radialGradient id="goldGlow" cx="50%" cy="40%" r="60%">
            <stop offset="0%" stop-color="#fff299"/>
            <stop offset="45%" stop-color="#ffde5b"/>
            <stop offset="100%" stop-color="#cca31a"/>
        </radialGradient>
    </defs>
    <!-- Circular Emblem Base -->
    <circle cx="32" cy="32" r="30" fill="url(#goldGlow)" stroke="#010619" stroke-width="2.5"/>
    <circle cx="32" cy="32" r="27" fill="none" stroke="#cca31a" stroke-width="0.8" opacity="0.6"/>

    <!-- Top Card Emblem -->
    <rect x="23" y="11" width="18" height="11.5" rx="2" fill="#010619"/>
    <rect x="25.5" y="14" width="4" height="3" rx="0.5" fill="#ffde5b"/>
    <line x1="23" y1="19" x2="41" y2="19" stroke="#ffde5b" stroke-width="0.8"/>

    <!-- Central "EC" Monogram -->
    <!-- Letter E -->
    <path d="M19 28 h11 v3 h-7.5 v3.5 h6 v2.8 h-6 v4.2 h8 v3 h-11.5 z" fill="#010619"/>
    <!-- Letter C -->
    <path d="M43.5 29 c-1.2-1 -3-1.5 -5-1.5 c-4.8 0 -7.5 3.5 -7.5 8.5 c0 5.2 2.8 8.5 7.5 8.5 c2.2 0 3.8-0.5 5.2-1.6 v-3.2 c-1.3 1 -2.7 1.6 -4.2 1.6 c-2.8 0 -4.2-2.1 -4.2-5.3 c0-3.3 1.4-5.3 4.2-5.3 c1.5 0 2.8 0.5 4 1.4 z" fill="#010619"/>

    <!-- Bottom 4-point Star -->
    <polygon points="32,48.5 33.2,51 35.5,52 33.2,53 32,55.5 30.8,53 28.5,52 30.8,51" fill="#010619"/>
</svg>
